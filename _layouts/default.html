<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
{% seo %}
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#303030">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <a id="skip-to-content" href="#content">Skip to the content.</a>
    {% assign cur = page.url | remove: '.html' %}
    <div class="layout">
      <aside class="sidebar" role="banner">
        <a class="sidebar-logo" href="{{ '/' | relative_url }}" aria-label="Love Ando — home">
          <img src="{{ '/assets/img/la-bug.svg' | relative_url }}" alt="Love Ando">
        </a>
        <p class="sidebar-tagline">{{ site.description }}</p>

        <nav class="site-nav" aria-label="Primary">
          <a href="{{ '/' | relative_url }}"{% if cur == '/' %} class="active" aria-current="page"{% endif %}>Home</a>
          <a href="{{ '/recaps' | relative_url }}"{% if cur == '/recaps' %} class="active" aria-current="page"{% endif %}>Recaps</a>
          <a href="{{ '/7300' | relative_url }}"{% if cur == '/7300' %} class="active" aria-current="page"{% endif %}>7300</a>
          <a href="{{ '/juice-box' | relative_url }}"{% if cur == '/juice-box' %} class="active" aria-current="page"{% endif %}>Juice Box</a>
          <a href="{{ '/statement' | relative_url }}"{% if cur == '/statement' %} class="active" aria-current="page"{% endif %}>Statement</a>
          <a href="{{ '/art-of-knocking' | relative_url }}"{% if cur == '/art-of-knocking' %} class="active" aria-current="page"{% endif %}>Art of Knocking</a>
        </nav>

        <div class="sidebar-footer">
          <a href="{{ site.github.repository_url }}">View on GitHub</a>
          <a href="{{ site.github.repository_url }}/archive/refs/heads/main.zip">Download all (.zip)</a>
        </div>
      </aside>

      <main id="content" class="main-content" role="main">
        {{ content }}

        <footer class="site-footer">
          <span class="site-footer-credits">Love Ando — open-source life systems. Built with <a href="https://pages.github.com">GitHub Pages</a>.</span>
        </footer>
      </main>
    </div>
  </body>
</html>
